# Continuous integration.
#
# The point of running this in CI rather than trusting a local `pytest` is
# that CI sees ONLY WHAT WAS COMMITTED. Both failures that have reached main
# so far were invisible locally for exactly that reason:
#
#   - metrics.py referenced venue_common.COMPETITION_END before venue_common
#     defined it. Both files were correct in the working tree; only one was
#     committed.
#   - lighter.py sat untracked while every one of its 539 test lines passed
#     locally.
#
# A fresh checkout is the only thing that reproduces either.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Railway deploys with `uv sync --locked`, which REFUSES to resolve and
      # fails the build outright when uv.lock disagrees with pyproject.toml.
      # That has already broken one deploy - a dependency was removed from
      # pyproject without re-running `uv lock`. Catching it here costs two
      # seconds; catching it on Railway costs a deploy.
      - name: uv.lock agrees with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      # No network is needed: tests/conftest.py installs placeholder Supabase
      # and Fernet values, and nothing in the suite connects.
      - name: Test
        run: uv run pytest -q

  web:
    name: Frontend build (what Vercel runs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` is the frontend's `uv lock --check`: it installs strictly
      # from package-lock.json and FAILS when the lockfile disagrees with
      # package.json, rather than quietly resolving something new. Same
      # failure the Python job guards against, same reasoning - catching it
      # here costs seconds, catching it on Vercel costs a deploy.
      - name: Install (lockfile must agree with package.json)
        run: npm ci

      # Unlike the Python jobs, this one is NOT hermetic: app/layout.tsx
      # imports Geist from next/font/google, which `next build` fetches from
      # Google at build time. A fonts outage or rate-limit therefore reds this
      # job for a reason unrelated to the commit. Caching .next/cache keeps
      # the fetched fonts between runs, so the usual build does not reach the
      # network at all - and speeds the build up besides.
      #
      # Keyed on the lockfile and invalidated by any source change, so a cache
      # hit can never serve a stale build.
      - name: Cache next build artifacts
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.ts', 'web/**/*.tsx', 'web/**/*.css') }}
          restore-keys: |
            next-${{ hashFiles('web/package-lock.json') }}-

      # `next build` type-checks as part of the build, so this is the step
      # that catches a type error. Vercel runs exactly this.
      - name: Build
        run: npm run build

      # Redundant with the build's own check in the normal case, and kept
      # deliberately: it still fires if someone sets
      # typescript.ignoreBuildErrors in next.config.ts.
      #
      # MUST run AFTER the build. Next generates the typed-routes files
      # under .next/types during a build, and tsconfig includes that path -
      # so on a fresh checkout, running tsc first fails with
      # `Type '"/"' is not assignable to type 'never'` against
      # app/layout.tsx's LayoutProps<"/">. The error points at the layout and
      # has nothing to do with it; reordering these two steps reintroduces it.
      - name: Typecheck
        run: npx tsc --noEmit

  edge-functions:
    name: Edge functions (what Supabase runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The register function is the only way into pending_signups, so it is
      # the only thing between an open form and a table of plaintext exchange
      # credentials. It runs on Deno inside Supabase, which neither of the
      # other jobs exercises: ruff does not read TypeScript, and the web job
      # builds Next, which never imports this file.
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Every step runs from supabase/functions, because Deno discovers
      # deno.json by walking up from the WORKING DIRECTORY rather than from
      # the file it is checking. Passing paths from the repository root finds
      # no config and fails with "@std/assert not a dependency".
      - name: Typecheck
        working-directory: supabase/functions
        run: deno check register/index.ts register/index_test.ts

      - name: Lint
        working-directory: supabase/functions
        run: deno lint .

      - name: Dependencies match the lockfile
        working-directory: supabase/functions
        run: deno install --frozen

      - name: Test
        working-directory: supabase/functions
        # --allow-env and nothing else. The tests stub fetch, so granting net
        # access would mean a test could quietly reach a real database.
        run: deno test --allow-env .

  deploy-install:
    name: Production install (what Railway runs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --no-dev is what the deploy does. A runtime module that quietly
      # depends on a dev-only package imports fine in the test job above and
      # fails on Railway; this is the job that tells them apart.
      - name: Install runtime dependencies only
        run: uv sync --locked --no-dev

      - name: Every module imports with runtime dependencies only
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_KEY: placeholder-key-for-ci
        run: |
          # Generated, not hard-coded: a Fernet-shaped literal in the
          # repository is a string every future secret scan has to rule out.
          # Nothing is encrypted here - the modules only require the variable
          # to be present at import.
          FERNET_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export FERNET_KEY

          uv run python - <<'PY'
          import ast
          import importlib
          import pathlib

          # Read the list from the test module rather than repeating it here.
          # Parsed rather than imported because that module needs pytest,
          # which --no-dev has deliberately not installed.
          source = pathlib.Path("tests/test_imports.py").read_text(encoding="utf-8")
          names = next(
              ast.literal_eval(node.value)
              for node in ast.parse(source).body
              if isinstance(node, ast.Assign)
              and any(getattr(t, "id", "") == "REQUIRED_MODULES" for t in node.targets)
          )

          for name in names:
              importlib.import_module(name)
              print("ok", name)

          print(f"\n{len(names)} module(s) import with runtime dependencies only")
          PY
